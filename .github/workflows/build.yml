name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir -p www
          cp index.html playlist.json www/
          if [ -d audio ]; then cp -r audio www/; fi
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @jofr/capacitor-media-session --legacy-peer-deps
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: android/app/build/outputs/apk/debug/app-debug.apk
