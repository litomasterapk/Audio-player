name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir -p www
          cp index.html playlist.json www/
          if [ -d audio ]; then cp -r audio www/; fi
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --legacy-peer-deps
          npx cap add android
          PKG=android/app/src/main/java/com/litomasterapk/audioplayer
          cp MediaNotifPlugin.java MainActivity.java $PKG/
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          printf "\ndependencies {\n    implementation 'androidx.media:media:1.7.0'\n}\n" >> android/app/build.gradle
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: android/app/build/outputs/apk/debug/app-debug.apk
