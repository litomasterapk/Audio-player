<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12262b">
<title>مشغّل الصوتيات</title>
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap">
<style>
:root{--bg:#12262b;--card:#1b363c;--tx:#eef3f1;--ac:#f0b35a;--font:"Cairo";--fs:16px;--line:color-mix(in srgb,var(--card) 75%,#fff 25%);--mut:color-mix(in srgb,var(--tx) 60%,var(--bg))}
*{box-sizing:border-box;margin:0}
html{font-size:var(--fs)}
body{font-family:var(--font),system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
h1{font-size:1.3rem;font-weight:700}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--card);padding:8px 14px;border-radius:10px}
button:hover{background:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:var(--bg);font-weight:700}
.pri:hover{background:var(--ac);filter:brightness(1.1)}
.now{background:var(--card);border-radius:18px;padding:22px 18px;margin-bottom:16px}
#title{font-size:1.4rem;font-weight:700;min-height:2.2em;margin-bottom:12px}
#seek{width:100%;accent-color:var(--ac)}
.times{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;direction:ltr}
.ctl{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;direction:ltr}
.ctl button{width:46px;height:46px;border-radius:50%;padding:0;font-size:1.1rem;background:var(--bg)}
.ctl #play{width:64px;height:64px;background:var(--ac);color:var(--bg);font-size:1.5rem}
.ctl .on{color:var(--ac)}
.sub{display:flex;justify-content:center;gap:10px;margin-top:12px}
ul{list-style:none;padding:0}
li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
li .t{flex:1;text-align:start;background:none;padding:10px 6px;border-radius:8px}
li.act .t{color:var(--ac);font-weight:700}
li .d{background:none;color:var(--mut);padding:6px 10px}
.panel{background:var(--card);border-radius:14px;padding:14px;margin-top:16px}
.panel h2{font-size:1rem;margin:6px 0 10px}
.panel input,.panel select{width:100%;margin-bottom:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
.panel input[type=color]{height:42px;padding:3px}
.lb{display:block;font-size:.8rem;color:var(--mut);margin-bottom:3px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.row span{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
.row select{width:auto;margin:0}
#msg{color:var(--ac);min-height:1.4em;margin-top:8px;font-size:.9rem}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--tx);padding:20px;width:min(92vw,360px)}
dialog::backdrop{background:#000a}
.tabs{display:flex;gap:8px;margin:14px 0 8px}
.tabs button{flex:1}
.tabs .on{background:var(--ac);color:var(--bg);font-weight:700}
.fld{width:100%;padding:9px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.panel input[type=checkbox]{width:auto}
#qName{margin:10px 0}
#banner{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;text-align:center;white-space:pre-line;line-height:1.9;color:var(--ac)}
.panel textarea{width:100%;margin-bottom:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;color:inherit}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--ac)}
.hide{display:none!important}
</style>
</head>
<body>
<main>
<header>
  <h1 id="appname">مشغّل الصوتيات</h1>
  <button id="acct">دخول</button>
</header>
<div id="banner" class="hide"></div>

<section class="now">
  <div id="title"></div>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="seek">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button id="shuf" aria-label="shuffle">⇄</button>
    <button id="prev" aria-label="previous">⏮</button>
    <button id="play" aria-label="play">▶</button>
    <button id="next" aria-label="next">⏭</button>
    <button id="rep" aria-label="repeat">⟳</button>
  </div>
  <div class="sub"><button id="spd"></button></div>
</section>

<nav class="tabs"><button id="tabLib" class="on" data-t="tab_lib"></button><button id="tabQ" data-t="tab_q"></button></nav>
<ul id="list"></ul>
<section id="quran" class="hide">
  <div id="qHome"><input id="qSearch" class="fld" data-tp="q_search"><ul id="qList"></ul></div>
  <div id="qRec" class="hide">
    <div class="row"><button id="qBack" data-t="back"></button><button class="pri" id="qAll" data-t="play_all"></button></div>
    <button id="qAddAll" class="hide" data-t="add_all" style="margin-top:8px"></button>
    <h2 id="qName"></h2>
    <select id="qMoshaf" class="fld"></select>
    <ul id="qSur"></ul>
  </div>
</section>

<section class="panel hide" id="upPanel">
  <h2 data-t="add_h"></h2>
  <input id="upTitle" data-tp="name_ph">
  <input id="upFile" type="file" accept="audio/*">
  <button class="pri" id="upBtn" data-t="upload"></button>
  <input id="upUrl" data-tp="url_ph" dir="ltr" style="margin-top:12px">
  <button class="pri" id="urlBtn" data-t="add_url"></button>
</section>

<section class="panel hide" id="adminPanel">
  <h2 data-t="st_h"></h2>
  <div class="bar"><i id="stFill"></i></div>
  <div id="stTxt" style="font-size:.9rem;margin-bottom:12px"></div>
  <h2 data-t="users_h"></h2>
  <div id="users"></div>
</section>

<section class="panel hide" id="setPanel">
  <h2 data-t="set_h"></h2>
  <div id="setBox"></div>
  <button class="pri" id="setSave" data-t="save"></button>
</section>

<div id="msg" role="status"></div>
</main>

<dialog id="dlg">
  <h2 style="margin-bottom:12px" data-t="login_h"></h2>
  <div class="panel" style="margin:0;padding:0;background:none">
    <input id="em" type="email" data-tp="email_ph" autocomplete="email">
    <input id="pw" type="password" data-tp="pw_ph" autocomplete="current-password">
  </div>
  <div class="row">
    <button class="pri" id="login" data-t="login"></button>
    <button id="signup" data-t="signup"></button>
    <button id="close" data-t="close"></button>
  </div>
  <div id="dmsg" style="color:var(--ac);font-size:.9rem"></div>
</dialog>

<audio id="au" preload="metadata"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://omtvqjfshfvhjzbulzqe.supabase.co";
const SUPABASE_KEY = "sb_publishable_E9RcGauLxX1MbOao1ouZzg_37avQxfY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const mk = (tag, p = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, p); e.append(...kids); return e; };
const au = $("au");
let tracks = [], idx = -1, shuffle = false, repeat = 0, user = null, role = "user";
const speeds = [1, 1.25, 1.5, 2, 0.75]; let si = 0;

/* ---------- النصوص والإعدادات ---------- */
const I18N = {
  ar: { login: "دخول", logout: "خروج", signup: "حساب جديد", close: "إغلاق", login_h: "تسجيل الدخول", email_ph: "البريد الإلكتروني", pw_ph: "كلمة المرور (6 أحرف على الأقل)", pick: "اختر مقطعًا للتشغيل", speed: "السرعة", no_tracks: "لا توجد مقاطع بعد.", del: "حذف", del_q: "حذف هذا المقطع؟", hello: "أهلًا", play_err: "تعذر تشغيل المقطع", add_h: "إضافة صوتية جديدة", name_ph: "اسم المقطع", upload: "رفع", fill: "اكتب الاسم واختر ملفًا", big: "الملف أكبر من 50MB", uploading: "جارٍ الرفع...", done: "تمت الإضافة", fail: "حدث خطأ", users_h: "إدارة المستخدمين", set_h: "لوحة التحكم", save: "حفظ", saved: "تم الحفظ", tab_lib: "المكتبة", tab_q: "القرآن", q_search: "ابحث عن شيخ", back: "رجوع", play_all: "تشغيل الكل", url_ph: "رابط مباشر لملف صوتي (https)", add_url: "إضافة بالرابط", loading: "جارٍ التحميل...", surah: "سورة", url_bad: "اكتب الاسم ورابطًا يبدأ بـ https", q_fail: "تعذر تحميل بيانات القرآن", add_all: "إضافة كل السور للمكتبة", add_one: "＋ مكتبة", exists: "موجودة في المكتبة بالفعل", st_h: "المساحة المستخدمة", left: "المتبقي" },
  en: { login: "Log in", logout: "Log out", signup: "Sign up", close: "Close", login_h: "Log in", email_ph: "Email", pw_ph: "Password (min 6 characters)", pick: "Pick a track to play", speed: "Speed", no_tracks: "No tracks yet.", del: "Delete", del_q: "Delete this track?", hello: "Welcome", play_err: "Could not play this track", add_h: "Add new audio", name_ph: "Track name", upload: "Upload", fill: "Enter a name and choose a file", big: "File is larger than 50MB", uploading: "Uploading...", done: "Added", fail: "Something went wrong", users_h: "Manage users", set_h: "Control panel", save: "Save", saved: "Saved", tab_lib: "Library", tab_q: "Quran", q_search: "Search reciter", back: "Back", play_all: "Play all", url_ph: "Direct audio link (https)", add_url: "Add by link", loading: "Loading...", surah: "Surah", url_bad: "Enter a name and an https link", q_fail: "Could not load Quran data", add_all: "Add all surahs to library", add_one: "+ Library", exists: "Already in the library", st_h: "Storage used", left: "left" }
};
const DEF = { app_name: "مشغّل الصوتيات", lang: "ar", font: "Cairo", fs: 16, accent: "#f0b35a", bg: "#12262b", card: "#1b363c", tx: "#eef3f1", notif: true, limit_mb: 1024, banner: "", texts: { ar: {}, en: {} } };
const FONTS = ["Cairo", "Tajawal", "Almarai", "Amiri", "Noto Naskh Arabic", "Roboto"];
const norm = d => ({ ...DEF, ...d, texts: { ar: {}, en: {}, ...(d.texts || {}) } });
let S = DEF;
try { const c = JSON.parse(localStorage.getItem("cfg")); if (c) S = norm(c); } catch (e) {}
const t = k => (S.texts[S.lang] && S.texts[S.lang][k]) || I18N[S.lang][k] || k;

function apply() {
  const r = document.documentElement, st = r.style;
  r.lang = S.lang; r.dir = S.lang === "ar" ? "rtl" : "ltr";
  st.setProperty("--font", '"' + S.font + '"'); st.setProperty("--fs", S.fs + "px");
  st.setProperty("--ac", S.accent); st.setProperty("--bg", S.bg); st.setProperty("--card", S.card); st.setProperty("--tx", S.tx);
  const fl = $("fontlink"), href = "https://fonts.googleapis.com/css2?family=" + S.font.replace(/ /g, "+") + ":wght@400;700&display=swap";
  if (fl.getAttribute("href") !== href) fl.setAttribute("href", href);
  document.title = S.app_name; $("appname").textContent = S.app_name;
  const bn = $("banner"); bn.textContent = S.banner || ""; bn.classList.toggle("hide", !(S.banner || "").trim());
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(e => e.placeholder = t(e.dataset.tp));
  $("acct").textContent = user ? t("logout") : t("login");
  $("spd").textContent = t("speed") + " " + speeds[si] + "x";
  if (idx < 0) $("title").textContent = t("pick");
  render();
}
async function loadSettings() {
  const { data } = await sb.from("settings").select("data").eq("id", 1).maybeSingle();
  if (data && data.data && Object.keys(data.data).length) {
    S = norm(data.data);
    try { localStorage.setItem("cfg", JSON.stringify(S)); } catch (e) {}
    apply(); if (role === "admin") buildSet();
  }
}
function say(m) { $("msg").textContent = m; }
function fmt(s) { if (!isFinite(s)) return "0:00"; return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); }

/* ---------- لوحة التحكم (للأدمن) ---------- */
function buildSet() {
  const b = $("setBox"); b.replaceChildren();
  const add = (label, el) => b.append(mk("label", { className: "lb" }, label), el);
  const inp = (key, type, extra = {}) => { const e = mk("input", { type, ...extra, value: S[key] }); e.oninput = () => { S[key] = type === "range" ? +e.value : e.value; apply(); }; return e; };
  const sel = (key, opts, after) => { const e = mk("select"); opts.forEach(([v, n]) => e.append(mk("option", { value: v, textContent: n }))); e.value = S[key]; e.onchange = () => { S[key] = e.value; apply(); if (after) after(); }; return e; };
  add("اسم التطبيق / App name", inp("app_name", "text"));
  const ta = mk("textarea", { rows: 4, value: S.banner || "" }); ta.oninput = () => { S.banner = ta.value; apply(); };
  add("كلمة أو دعاء في الشاشة الرئيسية / Message on home screen", ta);
  add("اللغة / Language", sel("lang", [["ar", "العربية"], ["en", "English"]], buildSet));
  add("الخط / Font", sel("font", FONTS.map(f => [f, f])));
  add("حجم الخط / Font size", inp("fs", "range", { min: 13, max: 24 }));
  [["accent", "لون التمييز / Accent"], ["bg", "الخلفية / Background"], ["card", "البطاقات / Cards"], ["tx", "الكتابة / Text"]].forEach(([k, n]) => add(n, inp(k, "color")));
  const cb = mk("input", { type: "checkbox", checked: S.notif !== false }); cb.onchange = () => { S.notif = cb.checked; };
  add("إشعار التحكم في أندرويد / Android controls notification", cb);
  add("حد المساحة (MB) / Storage limit (MB)", inp("limit_mb", "number", { min: 1 }));
  b.append(mk("h2", { textContent: "النصوص / Texts" }));
  Object.keys(I18N[S.lang]).forEach(k => {
    const e = mk("input", { value: t(k) });
    e.oninput = () => { (S.texts[S.lang] = S.texts[S.lang] || {})[k] = e.value; apply(); };
    add(I18N[S.lang][k], e);
  });
}
$("setSave").onclick = async () => {
  const { error } = await sb.from("settings").update({ data: S }).eq("id", 1);
  if (!error) try { localStorage.setItem("cfg", JSON.stringify(S)); } catch (e) {}
  say(error ? t("fail") + ": " + error.message : t("saved"));
  loadStorage();
};

/* ---------- القائمة ---------- */
let lib = tracks;
async function loadTracks() {
  let built = [];
  try { built = (await (await fetch("playlist.json", { cache: "no-cache" })).json()).map(x => ({ ...x, src: "built" })); } catch (e) {}
  let db = [];
  const { data } = await sb.from("tracks").select("*").order("created_at");
  if (data) db = data.map(x => ({ id: x.id, title: x.title, url: x.url, by: x.uploaded_by, src: "db" }));
  const now = idx >= 0 ? tracks[idx] : null, was = tracks === lib;
  lib = built.concat(db);
  if (was) { tracks = lib; idx = now ? tracks.findIndex(x => x.url === now.url) : -1; }
  render();
  if (role === "admin") loadStorage();
}
function render() {
  const ul = $("list"); ul.replaceChildren();
  if (!lib.length) ul.append(mk("li", { textContent: t("no_tracks") }));
  lib.forEach((tr, i) => {
    const li = mk("li", { className: tracks === lib && i === idx ? "act" : "" });
    li.append(mk("button", { className: "t", textContent: tr.title, onclick: () => play(i, lib) }));
    if (tr.src === "db" && user && (role === "admin" || tr.by === user.id)) li.append(mk("button", { className: "d", textContent: t("del"), onclick: () => del(tr) }));
    ul.append(li);
  });
  const u = idx >= 0 && tracks[idx] ? tracks[idx].url : "";
  document.querySelectorAll("#qSur li").forEach(li => li.classList.toggle("act", li.dataset.url === u));
}

/* ---------- إشعار التحكم (Android) ---------- */
const isNative = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const safe = p => { try { if (p && p.catch) p.catch(() => {}); } catch (e) {} };
const handlers = { play: () => au.play(), pause: () => au.pause(), next: () => next(false), prev: () => prev() };
let MN = null;
function mn() {
  if (!isNative || S.notif === false) return null;
  if (!MN) {
    try {
      MN = (Capacitor.Plugins && Capacitor.Plugins.MediaNotif) || Capacitor.registerPlugin("MediaNotif");
      safe(MN.addListener("action", e => { const f = handlers[e && e.action]; if (f) f(); }));
    } catch (e) { MN = null; }
  }
  return MN;
}
if (!isNative && "mediaSession" in navigator) {
  const wh = { play: handlers.play, pause: handlers.pause, nexttrack: handlers.next, previoustrack: handlers.prev };
  Object.entries(wh).forEach(([a, f]) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} });
}
function msMeta(tr) { if (!isNative && "mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: tr.title, artist: S.app_name }); }
function msState(st) { const m = mn(), tr = tracks[idx]; if (m && tr) safe(m.show({ title: tr.title, playing: st === "playing", app: S.app_name })); }
function msPos() {}

/* ---------- التشغيل ---------- */
function play(i, list) {
  if (list) tracks = list;
  if (i < 0 || i >= tracks.length) return;
  idx = i; au.src = tracks[i].url; au.playbackRate = speeds[si];
  au.play().catch(() => say(t("play_err")));
  $("title").textContent = tracks[i].title; render(); msMeta(tracks[i]);
}
function next(auto) {
  if (!tracks.length) return;
  if (shuffle && tracks.length > 1) { let n; do { n = Math.floor(Math.random() * tracks.length); } while (n === idx); return play(n); }
  if (idx + 1 < tracks.length) return play(idx + 1);
  if (repeat === 1 || !auto) return play(0);
  $("play").textContent = "▶"; msState("paused");
}
function prev() { if (au.currentTime > 3) au.currentTime = 0; else play(idx > 0 ? idx - 1 : tracks.length - 1); }

$("play").onclick = () => { if (idx < 0) return play(0); au.paused ? au.play() : au.pause(); };
$("next").onclick = () => next(false);
$("prev").onclick = () => prev();
$("shuf").onclick = () => { shuffle = !shuffle; $("shuf").classList.toggle("on", shuffle); };
$("rep").onclick = () => { repeat = (repeat + 1) % 3; $("rep").textContent = ["⟳", "⟳ ∞", "⟳ 1"][repeat]; $("rep").classList.toggle("on", repeat > 0); };
$("spd").onclick = () => { si = (si + 1) % speeds.length; au.playbackRate = speeds[si]; apply(); msPos(); };
$("seek").oninput = () => { if (au.duration) au.currentTime = au.duration * $("seek").value / 1000; };
au.onplay = () => { $("play").textContent = "⏸"; msState("playing"); msPos(); };
au.onpause = () => { $("play").textContent = "▶"; msState("paused"); msPos(); };
au.onloadedmetadata = () => { $("dur").textContent = fmt(au.duration); msPos(); };
au.ontimeupdate = () => { $("cur").textContent = fmt(au.currentTime); if (au.duration) $("seek").value = au.currentTime / au.duration * 1000; };
au.onended = () => repeat === 2 ? play(idx) : next(true);

/* ---------- القرآن (mp3quran.net) ---------- */
const API = "https://www.mp3quran.net/api/v3/";
let reciters = null, suwar = null, qLang = "", curRec = null, surTracks = [];
const lg = () => S.lang === "ar" ? "ar" : "eng";
function tab(q) {
  $("tabLib").classList.toggle("on", !q); $("tabQ").classList.toggle("on", q);
  $("list").classList.toggle("hide", q); $("quran").classList.toggle("hide", !q);
  if (q) loadQuran();
}
$("tabLib").onclick = () => tab(false);
$("tabQ").onclick = () => tab(true);
async function loadQuran() {
  if (reciters && qLang === lg()) return;
  $("qList").replaceChildren(mk("li", { textContent: t("loading") }));
  try {
    const [r, s2] = await Promise.all([fetch(API + "reciters?language=" + lg()).then(x => x.json()), fetch(API + "suwar?language=" + lg()).then(x => x.json())]);
    reciters = r.reciters; suwar = s2.suwar; qLang = lg(); drawReciters();
  } catch (e) { $("qList").replaceChildren(mk("li", { textContent: t("q_fail") })); }
}
function drawReciters() {
  const q = $("qSearch").value.trim().toLowerCase(), ul = $("qList"); ul.replaceChildren();
  reciters.filter(r => r.name.toLowerCase().includes(q)).forEach(r => ul.append(mk("li", {}, mk("button", { className: "t", textContent: r.name, onclick: () => openReciter(r) }))));
}
$("qSearch").oninput = () => { if (reciters) drawReciters(); };
function openReciter(r) {
  curRec = r; $("qHome").classList.add("hide"); $("qRec").classList.remove("hide"); $("qName").textContent = r.name;
  const sel = $("qMoshaf"); sel.replaceChildren();
  r.moshaf.forEach((m, i) => sel.append(mk("option", { value: i, textContent: m.name })));
  sel.classList.toggle("hide", r.moshaf.length < 2);
  drawSur();
}
function drawSur() {
  const m = curRec.moshaf[$("qMoshaf").value || 0], ul = $("qSur"); ul.replaceChildren();
  surTracks = m.surah_list.split(",").map(Number).map(id => {
    const s3 = suwar.find(x => x.id === id);
    return { title: t("surah") + " " + (s3 ? s3.name : id) + " - " + curRec.name, name: s3 ? s3.name : String(id), url: m.server + String(id).padStart(3, "0") + ".mp3", src: "q" };
  });
  surTracks.forEach((tr, i) => {
    const li = mk("li", {}, mk("button", { className: "t", textContent: t("surah") + " " + tr.name, onclick: () => play(i, surTracks) }));
    if (canAdd()) li.append(mk("button", { className: "d", textContent: t("add_one"), onclick: () => addToLib([tr]) }));
    li.dataset.url = tr.url; ul.append(li);
  });
  $("qAddAll").classList.toggle("hide", !canAdd());
  render();
}
$("qMoshaf").onchange = drawSur;
$("qBack").onclick = () => { $("qRec").classList.add("hide"); $("qHome").classList.remove("hide"); };
$("qAll").onclick = () => play(0, surTracks);

const canAdd = () => role === "uploader" || role === "admin";
async function addToLib(list) {
  const have = new Set(lib.map(x => x.url));
  const fresh = list.filter(x => !have.has(x.url)).map(x => ({ title: x.title, url: x.url }));
  if (!fresh.length) return say(t("exists"));
  const { error } = await sb.from("tracks").insert(fresh);
  if (error) return say(t("fail") + ": " + error.message);
  say(t("done") + " (" + fresh.length + ")"); loadTracks();
}
$("qAddAll").onclick = () => addToLib(surTracks);

/* ---------- المساحة (للأدمن) ---------- */
async function loadStorage() {
  const { data, error } = await sb.rpc("storage_used");
  if (error || data == null) { $("stTxt").textContent = error ? error.message : ""; return; }
  const used = Number(data) / 1048576, lim = Number(S.limit_mb) || 1024;
  $("stFill").style.width = Math.min(100, used / lim * 100) + "%";
  $("stTxt").textContent = used.toFixed(1) + " MB / " + lim + " MB - " + t("left") + " " + Math.max(0, lim - used).toFixed(1) + " MB";
}

/* ---------- إضافة بالرابط ---------- */
$("urlBtn").onclick = async () => {
  const title = $("upTitle").value.trim(), url = $("upUrl").value.trim();
  if (!title || !/^https:\/\//i.test(url)) return say(t("url_bad"));
  const { error } = await sb.from("tracks").insert({ title, url });
  if (error) return say(t("fail") + ": " + error.message);
  $("upTitle").value = ""; $("upUrl").value = ""; say(t("done")); loadTracks();
};

/* ---------- الحسابات ---------- */
const dlg = $("dlg");
$("acct").onclick = async () => { if (user) await sb.auth.signOut(); else { $("dmsg").textContent = ""; dlg.showModal(); } };
$("close").onclick = () => dlg.close();
async function auth(kind) {
  const email = $("em").value.trim(), password = $("pw").value;
  const { error } = kind === "in" ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
  if (error) { $("dmsg").textContent = error.message; return; }
  dlg.close();
}
$("login").onclick = () => auth("in");
$("signup").onclick = () => auth("up");

async function onUser(u) {
  user = u; role = "user";
  if (u) { const { data } = await sb.from("profiles").select("role").eq("id", u.id).single(); if (data) role = data.role; }
  $("upPanel").classList.toggle("hide", !(role === "uploader" || role === "admin"));
  $("adminPanel").classList.toggle("hide", role !== "admin");
  $("setPanel").classList.toggle("hide", role !== "admin");
  if (role === "admin") { loadUsers(); buildSet(); loadStorage(); }
  if (curRec) drawSur();
  say(u ? t("hello") + " " + u.email + " (" + role + ")" : "");
  apply();
}
sb.auth.onAuthStateChange((_e, s) => setTimeout(() => onUser(s ? s.user : null), 0));

/* ---------- الرفع والحذف ---------- */
$("upBtn").onclick = async () => {
  const f = $("upFile").files[0], title = $("upTitle").value.trim();
  if (!f || !title) return say(t("fill"));
  if (f.size > 50 * 1024 * 1024) return say(t("big"));
  say(t("uploading"));
  const ext = (f.name.split(".").pop() || "mp3").toLowerCase().replace(/[^a-z0-9]/g, "");
  const path = user.id + "/" + Date.now() + "." + ext;
  const up = await sb.storage.from("audio").upload(path, f, { contentType: f.type });
  if (up.error) return say(t("fail") + ": " + up.error.message);
  const url = sb.storage.from("audio").getPublicUrl(path).data.publicUrl;
  const ins = await sb.from("tracks").insert({ title, url });
  if (ins.error) return say(t("fail") + ": " + ins.error.message);
  $("upTitle").value = ""; $("upFile").value = ""; say(t("done")); loadTracks();
};
async function del(tr) {
  if (!confirm(t("del_q") + " " + tr.title)) return;
  const p = decodeURIComponent(tr.url.split("/object/public/audio/")[1] || "");
  if (p) await sb.storage.from("audio").remove([p]);
  const { error } = await sb.from("tracks").delete().eq("id", tr.id);
  if (error) return say(t("fail") + ": " + error.message);
  loadTracks();
}

/* ---------- إدارة المستخدمين ---------- */
async function loadUsers() {
  const { data, error } = await sb.from("profiles").select("*").order("email");
  const box = $("users"); box.replaceChildren();
  if (error) return say(error.message);
  data.forEach(p => {
    const sel = mk("select");
    ["user", "uploader", "admin"].forEach(v => sel.append(mk("option", { value: v, textContent: v })));
    sel.value = p.role;
    sel.onchange = async () => { const { error } = await sb.from("profiles").update({ role: sel.value }).eq("id", p.id); say(error ? error.message : t("saved")); };
    box.append(mk("div", { className: "row" }, mk("span", { textContent: p.email }), sel));
  });
}

apply(); loadSettings(); loadTracks();
</script>
</body>
</html>
